<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transfert réussi — Fusion Transfert</title>
  <meta name="description" content="Confirmation de votre transfert Mobile Money." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene">
    <div class="scene__glow"></div>

    <header class="hero">
      <span class="hero__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30">
          <path d="M4 16 L16 4 L28 16 L16 28 Z" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <path d="M4 16 L28 16" stroke="currentColor" stroke-width="2.4"/>
        </svg>
      </span>
      <h1>Fusion Transfert</h1>
      <p class="hero__tag">Envoyez de l'argent d'un réseau Mobile Money à un autre, partout où FusionMoney opère.</p>
    </header>

    <main class="card" id="card">

      <section class="panel" id="panel-success">
        <div class="status" id="status-visual">
          <div class="status__ring is-success" id="status-ring">
            <div class="status__icon" id="status-icon">✓</div>
          </div>
          <p class="status__title" id="status-title">Vérification…</p>
          <p class="status__message" id="status-message">Nous confirmons l'état de votre transfert.</p>
        </div>

        <dl class="summary" id="summary">
          <div><dt>Destinataire</dt><dd id="summary-phone">—</dd></div>
          <div><dt>Réseau</dt><dd id="summary-network">—</dd></div>
          <div><dt>Montant</dt><dd id="summary-amount">—</dd></div>
          <div><dt>Référence</dt><dd id="summary-token">—</dd></div>
        </dl>

        <a href="/" class="btn-secondary" id="new-transfer-link">Nouveau transfert</a>
      </section>

    </main>

    <p class="foot-note">Propulsé par les API Payin &amp; Payout de FusionMoney (MoneyFusion).</p>
  </div>

  <script src="success.js"></script>
</body>
</html>
